services:
  redis:
    image: redis:7-alpine
    container_name: redis-local-setup
    ports:
       - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
       - redis-data:/data

  mongo:
    image: mongo:7
    container_name: mongo-local
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: redis_learning
    volumes:
      - mongo-data:/data/db
    
volumes:
  redis-data:
  mongo-data:
    